[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baqgeo"
version = "0.1.0"
description = "NDVI e impermeabilidad por barrio desde el ImageServer WorldView de Barranquilla"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "requests>=2.31",
    "affine>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baqgeo = "baqgeo.cli:main"

[tool.setuptools]
packages = ["baqgeo"]

[tool.setuptools.package-data]
baqgeo = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
