# Publica el visor en GitHub Pages.
# Arma el sitio con `baqgeo visor` a partir de sitio/visor.json.
# Requiere Settings → Pages → Source: GitHub Actions.
name: Visor en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      hay_datos: ${{ steps.revisar.outputs.hay_datos }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Revisar si hay datos para publicar
        id: revisar
        run: |
          if [ -f sitio/visor.json ]; then
            echo "hay_datos=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_datos=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no existe sitio/visor.json; no se publica nada (ver sitio/LEEME.md)."
          fi

      - uses: actions/setup-python@v5
        if: steps.revisar.outputs.hay_datos == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar baqgeo
        if: steps.revisar.outputs.hay_datos == 'true'
        run: pip install .

      - name: Armar el visor
        if: steps.revisar.outputs.hay_datos == 'true'
        run: baqgeo visor --manifiesto sitio/visor.json --solo-datos-reales --salida _site

      - name: Versión del código del visor
        id: version
        if: steps.revisar.outputs.hay_datos == 'true'
        run: |
          version=$(grep -o 'visor.js?v=[0-9a-f]*' _site/index.html | cut -d= -f2)
          echo "Versión: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.revisar.outputs.hay_datos == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.revisar.outputs.hay_datos == 'true'
        with:
          path: _site

  desplegar:
    needs: construir
    if: needs.construir.outputs.hay_datos == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5

      # Pide el sitio en vivo y confirma que ya sirve la versión recién publicada.
      - name: Comprobar el sitio publicado
        env:
          URL: ${{ steps.despliegue.outputs.page_url }}
          VERSION: ${{ needs.construir.outputs.version }}
        run: |
          for intento in $(seq 1 12); do
            if curl -fsS -H "Cache-Control: no-cache" "${URL}?verificacion=$(date +%s)" \
                | grep -q "visor.js?v=${VERSION}" \
              && curl -fsS -o /dev/null "${URL}visor.js?v=${VERSION}" \
              && curl -fsS -o /dev/null "${URL}datos/capas.json"; then
              echo "El sitio sirve la versión ${VERSION}: ${URL}"
              exit 0
            fi
            echo "Todavía no se ve la versión ${VERSION}; reintento en 10 s (${intento}/12)."
            sleep 10
          done
          echo "::error::El sitio no sirve la versión ${VERSION} después de 2 minutos."
          exit 1
